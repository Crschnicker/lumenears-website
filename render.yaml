# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Static site, no build step: the repo root IS the published directory.
# The 133 MB raw video master (Hero Video.mp4) is gitignored, so it never
# reaches Render; video/hero.mp4 is the 5 MB web encode that ships.

services:
  - type: web
    name: lumenears-website
    runtime: static
    staticPublishPath: .
    pullRequestPreviewsEnabled: true

    headers:
      # Baseline hardening on everything
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

      # The video is the one asset likely to be re-cut mid-campaign, and its
      # filename is not content-hashed. 'immutable' would leave returning
      # visitors on the old cut for a year with no way to revalidate, so it
      # gets a short TTL instead; the ETag makes the recheck a cheap 304.
      - path: /video/*
        name: Cache-Control
        value: public, max-age=3600, must-revalidate

      # Images and fonts are stable, so they can cache hard
      - path: /images/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /audio/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # CSS and JS filenames are not content-hashed, so they must revalidate
      # or edits would never reach anyone holding a cached copy.
      - path: /css/*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /js/*
        name: Cache-Control
        value: public, max-age=0, must-revalidate

    routes:
      # The bare root does not resolve to index.html on its own here, so map
      # it explicitly. (/index.html served fine while / returned 404.)
      - type: rewrite
        source: /
        destination: /index.html

      # Pretty URLs for the legal pages. No catch-all rewrite: this is a
      # multi-page site, not an SPA, so unknown paths should 404 normally.
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html

  # Waitlist signups from the popup: stores the address and hands Resend the
  # confirmation email. Kept separate from the static site so the marketing
  # page stays a pile of files on a CDN.
  - type: web
    name: lumenears-waitlist-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lumenears-waitlist-db
          property: connectionString
      # Secrets: set these in the Render dashboard, not here.
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: RESEND_FROM
        value: LumenEars <help@lumenears.com>
      - key: ALLOWED_ORIGINS
        value: https://lumenears.com,https://www.lumenears.com

databases:
  # Not free: Render allows one free database per account and this account
  # already has it. basic-256mb is the smallest paid tier, and a paid database
  # also avoids the free tier's 30-day expiry landing mid-campaign.
  - name: lumenears-waitlist-db
    databaseName: lumenears
    user: lumenears
    plan: basic-256mb
